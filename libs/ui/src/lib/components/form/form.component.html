<form
  [formGroup]="formGroup"
  (ngSubmit)="onSubmit($event)"
  [class]="customClass || 'flex flex-col gap-5 w-full'"
  novalidate
>
  <div
    *ngIf="errorMessage"
    class="flex items-center gap-2 p-3.5 rounded-lg bg-danger-soft border border-danger-soft-border text-danger-active text-sm"
    role="alert"
  >
    <ui-icon icon="@tui.circle-alert" size="sm" class="shrink-0" />
    <span class="font-medium">{{ errorMessage }}</span>
  </div>

  <div
    *ngIf="successMessage"
    class="flex items-center gap-2 p-3.5 rounded-lg bg-success-soft border border-success-soft-border text-success-deep text-sm"
    role="status"
  >
    <ui-icon icon="@tui.circle-check" size="sm" class="shrink-0" />
    <span class="font-medium">{{ successMessage }}</span>
  </div>

  <ng-content></ng-content>
</form>
